name: 'Biome Check'

on:
  push:
    branches:
      - develop
      - main
  # Run for pull requests from any branch to any base branch: on creation,
  # when new commits are pushed to the PR, and when it is reopened.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

# Cancel a run when a newer commit is pushed to the same pull request. Pushes
# to develop/main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  biome:
    name: 'Code Quality Check'
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout repository'
        # actions/checkout@v4
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # actions/setup-node@v4
      - name: 'Setup Node.js'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      # Install pnpm without a third-party action (the repository's Actions
      # policy only allows GitHub-owned actions). The version comes from the
      # `packageManager` field in package.json.
      - name: 'Enable pnpm'
        run: |
          version="$(node -p "require('./package.json').packageManager.split('@')[1]")"
          npm install --global "pnpm@${version}"
          pnpm --version

      # actions/cache@v4
      - name: 'Cache pnpm store'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install safe-chain
        run: curl -fsSL https://raw.githubusercontent.com/AikidoSec/safe-chain/6aec1bc4743028a99ab1ebace8e743549260ce82/install-scripts/install-safe-chain.sh | sh -s -- --ci

      - name: 'Install dependencies'
        run: pnpm install --frozen-lockfile

      - name: 'Run Biome linting'
        run: pnpm lint

      - name: 'Run Biome formatting check'
        run: pnpm format

      - name: 'Run Biome comprehensive check'
        run: pnpm check
