name: test

on:
  push:
    branches:
      - develop
      - main
  # Run for pull requests from any branch to any base branch: on creation,
  # when new commits are pushed to the PR, and when it is reopened.
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

# Cancel a run when a newer commit is pushed to the same pull request. Pushes
# to develop/main always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    # E2E tests run on a GPU-less Ubuntu runner. Mesa's software stack provides
    # both APIs: llvmpipe for GL/WebGL2 and lavapipe for Vulkan. Chromium's
    # "WebGPU on Vulkan via GL interop" path then lets the WebGPU canvas be
    # composited and captured (see vitest-puppeteer.config.js), so the whole E2E
    # suite, WebGPU included, compares screenshots here.
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      # actions/checkout@v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
      # pnpm/action-setup@v6
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        with:
          version: 12
      # actions/setup-node@v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: 'pnpm'
      - name: Install safe-chain
        run: curl -fsSL https://raw.githubusercontent.com/AikidoSec/safe-chain/6aec1bc4743028a99ab1ebace8e743549260ce82/install-scripts/install-safe-chain.sh | sh -s -- --ci
      - run: pnpm install --frozen-lockfile
      - name: Install Chrome dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libgbm1 libxkbcommon0 libxcomposite1 libxdamage1 \
            libxfixes3 libxrandr2 libxss1 libdrm2 libpango-1.0-0 libcairo2 \
            fonts-liberation \
            libegl1 libgl1-mesa-dri mesa-vulkan-drivers
      - run: pnpm run build
      # actions/upload-artifact@v4
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Rhodonite-distribution-files
          path: dist
      - run: pnpm run build-samples
      - name: Run unit tests
        run: pnpm run test-unit
      - name: Run E2E tests
        run: pnpm run test-e2e
      - name: Upload E2E failure artifacts
        if: failure()
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-image-diffs
          path: samples/test_e2e/**/__image_snapshots__/__diff_output__/**
          if-no-files-found: ignore
